spring.application.name=motolocation
server.port=8080

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Disable Flyway for now
spring.flyway.enabled=false

# Set Hibernate to validate what Flyway creates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave da API para autenticação
# Esta propriedade é lida a partir da variável de ambiente MOTOLOCATION_API_KEY
# Exemplo: export MOTOLOCATION_API_KEY=sua-chave-secreta
motolocation.api.key=${MOTOLOCATION_API_KEY}
