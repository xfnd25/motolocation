spring.application.name=motolocation
server.port=8080

# PostgreSQL Docker Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/motolocation
spring.datasource.username=mottu
spring.datasource.password=mottu_password

# Enable Flyway
spring.flyway.enabled=true

# Set Hibernate to validate what Flyway creates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave da API para autenticação
# Esta propriedade é lida a partir da variável de ambiente MOTOLOCATION_API_KEY
# Exemplo: export MOTOLOCATION_API_KEY=sua-chave-secreta
motolocation.api.key=${MOTOLOCATION_API_KEY}
